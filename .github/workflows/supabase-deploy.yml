# Puts the app's server code on Supabase whenever it changes on main (and on demand from the Actions tab).
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (see SUPABASE.md).
name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the secrets are set
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are not set yet, so nothing was deployed. See SUPABASE.md."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Deploy the rtg function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy rtg --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Check it answers
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          sleep 5
          curl -sf "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/rtg" | tee /dev/stderr | grep -q '"ok":true'
